name: CI

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - feature/shadow-mode

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Temporary maintenance step for the Shadow prompt-spec version bump.
      # Removed once the generated canonical goldens are committed.
      - name: Generate Shadow prompt goldens
        run: pnpm exec tsx scripts/generate-shadow-prompt-goldens.mts

      - name: Upload Shadow prompt goldens
        uses: actions/upload-artifact@v4
        with:
          name: shadow-prompt-goldens
          path: tmp/shadow-prompt-goldens

      - name: Commit generated Shadow prompt goldens
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/shadow-mode'
        run: |
          cp tmp/shadow-prompt-goldens/completion_coder.v3.txt test/fixtures/prompts/render-integrity/completion_coder.v3.txt
          cp tmp/shadow-prompt-goldens/completion_reviewer.v7.txt test/fixtures/prompts/render-integrity/completion_reviewer.v7.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/prompts/render-integrity/completion_coder.v3.txt
          git add test/fixtures/prompts/render-integrity/completion_reviewer.v7.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add Shadow completion prompt goldens"
            git push origin HEAD:feature/shadow-mode
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package
        run: node scripts/verify-package.mjs
